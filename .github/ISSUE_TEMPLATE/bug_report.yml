name: 🐛 Bug report
description: Report a bug in Awtly
title: "[BUG] (short description here)"
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: Describe the problem
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Environment

  - type: input
    id: awtly_version
    attributes:
      label: Awtly version
      placeholder: e.g. 0.5.0
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: e.g. 3.12.5
    validations:
      required: true

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Debug Log

        If Awtly generated a **debug.log** file, please attach it into the corresponding section.
        The log file usually contains the information needed to reproduce the problem.
